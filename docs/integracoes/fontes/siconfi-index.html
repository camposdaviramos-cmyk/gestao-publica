<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SICONFI API – Tesouro Nacional</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; }
    header { background: #1a2e4a; color: #fff; padding: 1rem 2rem; }
    header a { color: #a8c4e0; text-decoration: none; font-size: 0.85rem; }
    header a:hover { color: #fff; }
    header h1 { margin-top: 0.5rem; font-size: 1.2rem; }
    nav { background: #223754; padding: 0 2rem; display: flex; overflow-x: auto; }
    nav a { color: #a8c4e0; padding: 0.85rem 1.25rem; font-size: 0.875rem; text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap; }
    nav a:hover { color: #fff; }
    nav a.active { color: #fff; border-bottom-color: #4da6ff; font-weight: 600; }
    #swagger-ui { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }
    .swagger-ui .topbar { display: none; }
  </style>
</head>
<body>
  <header>
    <a href="/">Voltar ao portal</a>
    <h1>APIs Data Lake – Secretaria do Tesouro Nacional</h1>
  </header>
  <nav>
    <a href="/docs/custos">Custos</a>
    <a href="/docs/sadipem">SADIPEM</a>
    <a href="/docs/siconfi" class="active">SICONFI</a>
    <a href="/docs/teto_gastos">Teto de Gastos</a>
  </nav>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script>
    SwaggerUIBundle({
      url: "/docs/siconfi.yaml",
      dom_id: "#swagger-ui",
      deepLinking: true,
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
      plugins: [SwaggerUIBundle.plugins.DownloadUrl],
      layout: "StandaloneLayout",
      tryItOutEnabled: true,
      supportedSubmitMethods: ["get"],
      validatorUrl: null
    });
  </script>
</body>
</html>
