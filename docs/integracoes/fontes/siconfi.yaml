swagger: "2.0"
info:
  description: "Bem vindo a versão beta da API serviço de Dados abertos da Secretaria do Tesouro Nacional. Aqui você pode obter desde pequenas frações até grandes volumes de dados. Logo abaixo você pode experimentar as URL de acesso aos dados e testar seus respectivos parâmetros de consulta. Por padrão nossas consultas retornam 5.000 itens por página e os dados são entregues em formato JSON. \n \n <b>ATENÇÃO: Para fins de performance, o limite é de uma (01) requisição por segundo.</b><p> Para dúvidas ou sugestões, utilize nosso serviço de atendimento pelo link: [E-Serviços do Tesouro Nacional](https://e-servicos.tesouro.gov.br/#/Servico/1379821)</p> <p>A equipe da STN não fornecerá suporte técnico sobre como trabalhar com a tecnologia da API. É recomendável ter experiência com programação para utilizar essa modalidade de consulta.\n  Caso você não possua esse conhecimento técnico, os mesmos dados poderão ser obtidos no site do SICONFI (https://siconfi.tesouro.gov.br/), no menu CONSULTAS.</p>"
  version: "1.1.0"
  title: "SICONFI API"
    
  license:
    name: "Apache 2.0"
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"

#host: "api.tesouro.gov.br"
host: "apidatalake.tesouro.gov.br/ords/cdwhprd/siconfi/tt/"
#basePath: "/v2"
tags:
- name: "Anexos"
  description: "Anexos dos relatórios por Esfera de Governo"
  externalDocs:
    description: "Veja mais"
    url: "https://siconfi.tesouro.gov.br/siconfi/pages/public/conteudo/conteudo.jsf?id=581"
- name: "Entes"
  description: "Cadastro de Entes da Federação"
  externalDocs:
    description: "Veja mais"
    url: "https://siconfi.tesouro.gov.br/siconfi/pages/public/conteudo/conteudo.jsf?id=581"
- name: "Extrato de Entregas"
  description: "Extrato de relatórios homologados e matrizes entregues"
  externalDocs:
    description: "Veja mais"
    url: "https://siconfi.tesouro.gov.br/siconfi/pages/public/conteudo/conteudo.jsf?id=581"
- name: "RREO"
  description: "Relatório Resumido da Execução Orçamentária"
  externalDocs:
    description: "Veja mais"
    url: "http://www.tesouro.fazenda.gov.br/mdf"
- name: "RGF"
  description: "Relatório de Gestão Fiscal"
  externalDocs:
    description: "Veja mais"
    url: "http://www.tesouro.fazenda.gov.br/mdf"
- name: "DCA"
  description: "Declaração de contas anuais"
  externalDocs:
    description: "Veja mais"
    url: "http://www.tesouro.fazenda.gov.br/balanco-do-setor-publico-nacional-bspn-"
- name: "MSC - Patrimonial"
  description: "Matriz de Saldos Contábeis - contas patrimoniais"
  externalDocs:
    description: "Veja mais"
    url: "http://www.tesouro.fazenda.gov.br/-/matriz-de-saldos-contabeis-msc-"
- name: "MSC - Orçamentária"
  description: "Matriz de Saldos Contábeis - contas orçamentárias"
  externalDocs:
    description: "Veja mais"
    url: "http://www.tesouro.fazenda.gov.br/-/matriz-de-saldos-contabeis-msc-"
- name: "MSC - Controle"
  description: "Matriz de Saldos Contábeis - contas de controle"
  externalDocs:
    description: "Veja mais"
    url: "http://www.tesouro.fazenda.gov.br/-/matriz-de-saldos-contabeis-msc-"
#schemes:
##- "https"
#- "http"
paths:
  /rreo:
    get:
      tags:
      - "RREO"
      summary: "Lista dos dados contidos nos anexos do RREO."
      description: "Lista de dados contidos nos quadros dos anexos do Relatório Resumido de Execução Orçamentária - RREO para um ente e período específicos. Apenas o parâmetro <b>no_anexo é opcional</b>."
      #operationId: "addPet"           
      produces:
      - "application/json"
      parameters:
      - name: "an_exercicio"
        in: "query"
        description: "Exercício do relatório."
        required: true
        type: "integer"
        format: "int64"
        # schema:
        #   $ref: "#/definitions/Pet"  
      - name: "nr_periodo"
        in: "query"
        description: "Bimestre de referência do relatório dentro de um exercício."
        required: true
        type: "integer"
        enum:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
        # schema:
        #   $ref: "#/definitions/Pet"
      - name: "co_tipo_demonstrativo"
        in: "query"
        description: "Tipo do Demonstrativo. RREO Simplificado aplica-se apenas aos municípios com menos de 50 mil habitantes que optaram pela publicação simplificada."
        required: true
        type: "string"
        enum:
          - "RREO"
          - "RREO Simplificado"
      - name: "no_anexo"
        in: "query"
        description: "Os diversos demonstrativos do RREO são agrupados em anexos."
        required: false
        type: "string"
        enum:
        - "RREO-Anexo 01"
        - "RREO-Anexo 02"
        - "RREO-Anexo 03"
        - "RREO-Anexo 04"
        - "RREO-Anexo 04 - RGPS"
        - "RREO-Anexo 04 - RPPS"
        - "RREO-Anexo 04.0 - RGPS"
        - "RREO-Anexo 04.1"
        - "RREO-Anexo 04.2"
        - "RREO-Anexo 04.3 - RGPS"
        - "RREO-Anexo 05"
        - "RREO-Anexo 06"
        - "RREO-Anexo 07"
        - "RREO-Anexo 09"
        - "RREO-Anexo 10 - RGPS"
        - "RREO-Anexo 10 - RPPS"
        - "RREO-Anexo 11"
        - "RREO-Anexo 13"
        - "RREO-Anexo 14"
      - name: "co_esfera"
        in: "query"
        description: "Filtro de esfera M = Municípios, E = Estados e DF, U = União e C = Consórcio"
        required: false
        type: "string"
        enum:
        - "M"
        - "E"
        - "U"
        - "C"
      - name: "id_ente"
        in: "query"
        description: "Código IBGE do Ente."
        required: true
        type: "integer"    
        # schema:
        #   $ref: "#/definitions/Pet"
      responses:
        200:
          description: "Operação Realizada com sucesso"
          schema: 
              $ref: "#/definitions/RREO"
  /rgf:
    get:
      tags:
      - "RGF"
      summary: "Lista dos dados contidos nos anexos do RGF."
      description: "Lista de dados contidos nos quadros dos anexos do Relatório  de Gestão Fiscal - RGF para um poder/órgão e período específicos. Apenas o parâmetro <b>no_anexo é opcional</b>."
      #operationId: "addPet"          
      produces:
      - "application/json"
      parameters:
      - name: "an_exercicio"
        in: "query"
        description: "Exercício do relatório."
        required: true
        type: "integer"
        format: "int64"
        # schema:
        #   $ref: "#/definitions/Pet"    
      - name: "in_periodicidade"
        in: "query"
        description: "Periodicidade de publicação do relatório S = Semestral ou Q = quadrimestral. A periodicidade semestral aplica-se apenas aos municípios com menos de 50 mil habitantes que optaram pela publicação simplificada. A periodicidade padrão do relatório é quadrimestral."
        required: true
        type: "string"
        enum:
          - "Q"
          - "S"
        # schema:
        #   $ref: "#/definitions/Pet"
      - name: "nr_periodo"
        in: "query"
        description: "Quadrimestre ou semestre de referência do relatório dentro de um exercício. A periodicidade semestral aplica-se apenas aos municípios com menos de 50 mil habitantes que optaram pela publicação simplificada. A periodicidade padrão do relatório é quadrimestral."
        required: true
        type: "integer"
        enum:
          - "1"
          - "2"
          - "3"
        # schema:
        #   $ref: "#/definitions/Pet"
      - name: "co_tipo_demonstrativo"
        in: "query"
        description: "Tipo do Demonstrativo. RGF Simplificado aplica-se apenas aos municípios com menos de 50 mil habitantes que optaram pela publicação semestral dos relatórios."
        required: true
        type: "string"
        enum:
          - "RGF"
          - "RGF Simplificado"
        # schema:
        #   $ref: "#/definitions/Pet"
      - name: "no_anexo"
        in: "query"
        description: "Os diversos demonstrativos do RGF são agrupados em anexos."
        required: false
        type: "string"
        enum:
        - "RGF-Anexo 01"
        - "RGF-Anexo 02"
        - "RGF-Anexo 03"
        - "RGF-Anexo 04"
        - "RGF-Anexo 05"
        - "RGF-Anexo 06"
        # schema:
        #   $ref: "#/definitions/Pet"
      - name: "co_esfera"
        in: "query"
        description: "Filtro de esfera M = Municípios, E = Estados e DF, U = União e C = Consórcio"
        required: false
        type: "string"
        enum:
        - "M"
        - "E"
        - "U"
        - "C"
        # schema:
        #   $ref: "#/definitions/Pet"
      - name: "co_poder"
        in: "query"
        description: "Código do poder E = Executivo, L = Legislativo, J = Judiciário, M = Ministério Público, D = Defensoria Pública"
        required: true
        type: "string"
        enum:
        - "E"
        - "L"
        - "J"
        - "M"
        - "D"
      - name: "id_ente"
        in: "query"
        description: "Código IBGE do Ente."
        required: true
        type: "integer"             
        # schema:
        #   $ref: "#/definitions/Pet"
      responses:
        200:
          description: "Operação Realizada com sucesso"  
          schema: 
              $ref: "#/definitions/RGF" 
  /dca:
    get:
      tags:
      - "DCA"
      summary: "Lista dos dados contidos nos quadros das contas anuais"
      description: "Lista de dados contidos nos quadros da Declaração das Contas Anuais - DCA e do antigo Quadro de Detalhamento das Contas Contábeis - QDCC para um ente e exercício específicos. Apenas o parâmetro <b>no_anexo é opcional</b>."
      #operationId: "addPet"           
      produces:
      - "application/json"
      parameters:
      - name: "an_exercicio"
        in: "query"
        description: "Exercício do relatório."
        required: true
        type: "integer"
        format: "int64"
        # schema:
        #   $ref: "#/definitions/Pet"     
      - name: "no_anexo"
        in: "query"
        description: "Anexos do relatório. ATENÇÃO: As contas do exercício de 2013 foram entregues em dois formatos: QDCC para entes que não haviam aderido ao PCASP e DCA para todos os demais. Assim apenas os anexos que possuem o prefixo DCA são referentes a esse relatório, os demais anexos referem-se aos dados do QDCC de 2013."
        required: false
        type: "string"
        enum:
        - "Anexo I-AB"
        - "Anexo I-C"
        - "Anexo I-D"
        - "Anexo I-E"
        - "Anexo I-F"
        - "Anexo I-G"
        - "Anexo I-HI"
        - "DCA-Anexo I-AB"
        - "DCA-Anexo I-C"
        - "DCA-Anexo I-D"
        - "DCA-Anexo I-E"
        - "DCA-Anexo I-F"
        - "DCA-Anexo I-G"
        - "DCA-Anexo I-HI"
      - name: "id_ente"
        in: "query"
        description: "Código IBGE do Ente."
        required: true
        type: "integer"          
        # schema:
        #   $ref: "#/definitions/Pet"
      responses:
        200:
          description: "Operação Realizada com sucesso"
          schema: 
              $ref: "#/definitions/DCA"   
  /msc_patrimonial:
    get:
      tags:
      - "MSC - Patrimonial"
      summary: "Detalhamento dos registros informados nas contas contábeis que recebem lançamentos de natureza patrimonial."
      description: "Refere-se às contas contábeis de ativos (classe 1), passivos (classe 2), variações patrimoniais diminutivas (classe 3) e variações patrimoniais aumentativas (classe 4) bem como suas respectivas informações complementares. Todos os filtros são obrigatórios."
      #operationId: "addPet"          
      produces:
      - "application/json"
      parameters:
      - name: "id_ente"
        in: "query"
        description: "Código IBGE do Ente."
        required: true
        type: "integer"
      - name: "an_referencia"
        in: "query"
        description: "Exercício de referência da matriz."
        required: true
        type: "integer"
        format: "int64"     
      - name: "me_referencia"
        in: "query"
        description: "Mês de referência da matriz"
        required: true
        type: "integer"
        format: "int64"        
      - name: "co_tipo_matriz"
        in: "query"
        description: "Tipo de matriz enviada ao Siconfi: mensal ou agregada (MSCC) ou de encerramento do exercício (MSCE)."
        required: true
        type: "string"
        enum:
        - "MSCC"
        - "MSCE"
      - name: "classe_conta"
        in: "query"
        description: "Classe de contas contábeis que recebem lançamentos de natureza patrimonial."
        required: true
        type: "integer"
        enum:
        - "1"
        - "2"
        - "3"
        - "4"      
      - name: "id_tv"
        in: "query"
        description: "Os valores detalhados em uma MSC podem ser de três tipos: saldo incial (beginning_balance), saldo final (ending_balance) ou movimento (period_change)."
        required: true
        type: "string"
        enum:
        - "beginning_balance"
        - "period_change"
        - "ending_balance"          
        # schema:
        #   $ref: "#/definitions/Pet"
      responses:
        200:
          description: "Operação Realizada com sucesso"
          schema: 
              $ref: "#/definitions/MSC-Patrimonial"
  /msc_orcamentaria:
    get:
      tags:
      - "MSC - Orçamentária"
      summary: "Detalhamento dos registros informados nas contas contábeis que recebem lançamentos de natureza orçamentária."
      description: "Refere-se às contas contábeis de controle da aprovação (classe 5) e da execução (classe 6) do planejamento e orçamento bem como suas respectivas informações complementares. Todos os filtros são obrigatórios."
      #operationId: "addPet"          
      produces:
      - "application/json"
      parameters:
      - name: "id_ente"
        in: "query"
        description: "Código IBGE do Ente."
        required: true
        type: "integer"
      - name: "an_referencia"
        in: "query"
        description: "Exercício de referência da matriz."
        required: true
        type: "integer"
        format: "int64"
      - name: "me_referencia"
        in: "query"
        description: "Mês de referência da matriz."
        required: true
        type: "integer"
        format: "int64"
      - name: "co_tipo_matriz"
        in: "query"
        description: "Tipo de matriz enviada ao Siconfi: mensal ou agregada (MSCC) ou de encerramento do exercício (MSCE)."
        required: true
        type: "string"
        enum:
        - "MSCC"
        - "MSCE"
      - name: "classe_conta"
        in: "query"
        description: "Classe de contas contábeis que recebem lançamentos de natureza orçamentária."
        required: true
        type: "integer"
        enum:
        - "5"
        - "6"      
      - name: "id_tv"
        in: "query"
        description: "Os valores detalhados em uma MSC podem ser de três tipos: saldo incial (beginning_balance), saldo final (ending_balance) ou movimento (period_change)."
        required: true
        type: "string"
        enum:
        - "beginning_balance"
        - "period_change"
        - "ending_balance"          
        # schema:
        #   $ref: "#/definitions/Pet"
      responses:
        200:
          description: "Operação Realizada com sucesso"
          schema: 
              $ref: "#/definitions/MSC-Orcamentaria"
  /msc_controle:
    get:
      tags:
      - "MSC - Controle"
      summary: "Detalhamento dos registros informados nas contas contábeis que recebem lançamentos de natureza de controle."
      description: "Refere-se às contas contábeis de controle para conferência de saldos de natureza devedora (classe 7) e de natureza credora (classe 8) bem como suas respectivas informações complementares. Todos os filtros são obrigatórios."
      #operationId: "addPet"          
      produces:
      - "application/json"
      parameters:
      - name: "id_ente"
        in: "query"
        description: "Código IBGE do Ente."
        required: true
        type: "integer"
      - name: "an_referencia"
        in: "query"
        description: "Exercício de referência da matriz."
        required: true
        type: "integer"
        format: "int64"      
      - name: "me_referencia"
        in: "query"
        description: "Mês de referência da matriz."
        required: true
        type: "integer"
        format: "int64"        
      - name: "co_tipo_matriz"
        in: "query"
        description: "Tipo de matriz enviada ao Siconfi: mensal ou agregada (MSCC) ou de encerramento do exercício (MSCE)."
        required: true
        type: "string"
        enum:
        - "MSCC"
        - "MSCE"
      - name: "classe_conta"
        in: "query"
        description: "CClasse de contas contábeis que recebem lançamentos de natureza de controle."
        required: true
        type: "integer"
        enum:
        - "7"
        - "8"      
      - name: "id_tv"
        in: "query"
        description: "Os valores detalhados em uma MSC podem ser de três tipos: saldo incial (beginning_balance), saldo final (ending_balance) ou movimento (period_change)."
        required: true
        type: "string"
        enum:
        - "beginning_balance"
        - "period_change"
        - "ending_balance"      
      responses:
        200:
          description: "Operação Realizada com sucesso"
          schema: 
              $ref: "#/definitions/MSC-Controle"
  /entes:
    get:
      tags:
      - "Entes"
      summary: "Informações básicas dos entes da federação."
      description: "Refere-se às informações básicas de cadastro dos entes da federação."
      #operationId: "addPet"          
      produces:
      - "application/json"
      responses:
        200:
          description: "Operação Realizada com sucesso"
          schema: 
              $ref: "#/definitions/Entes"
  /extrato_entregas:
      get:
        tags:
        - "Extrato de Entregas"
        summary: "Extrato contendo informações sobre relatórios homologados e retificados e matrizes entregues."
        description: "Informações sobre relatórios homologados e retificados bem como matrizes entregues no Siconfi."
        #operationId: "addPet"            
        produces:
        - "application/json"
        parameters:
        - name: "id_ente"
          in: "query"
          description: "Código IBGE do Ente."
          required: true
          type: "integer"
        - name: "an_referencia"
          in: "query"
          description: "Exercício de referência."
          required: true
          type: "integer"
          format: "int64"
        responses:
          200:
            description: "Operação Realizada com sucesso"
            schema: 
              $ref: "#/definitions/Extrato"
  /anexos-relatorios:
      get:
        tags:
        - "Anexos"
        summary: "Tabela de apoio dos anexos dos relatórios"
        description: "Refere-se às dos anexos de cada um dos relatórios/demonstrativos agrupados por esfera de governo."
        #operationId: "addPet"            
        produces:
        - "application/json"
        responses:
          200:
            description: "Operação Realizada com sucesso"
            schema: 
              $ref: "#/definitions/Anexos"
definitions:
  Anexos:
    type: "object"
    #required:
    #  - null
    properties:
      esfera:
        type: "string"
        example: 'M'
        description: "Refere-se à esfera de governo onde: U = União, E = Estados (inclusive DF) e M=Municípios"
        enum:
        - "M"
        - "E"
        - "U"
      demonstrativo:
        type: "string"
        example: "RREO Simplificado"
        description: "Tipo de relatório entregue"
        enum:
        - "RREO"
        - "RREO Simplificado"
        - "RGF"
        - "RGF Simplificado"
        - "DCA"
        - "QDCC"
      anexo:
        type: "string"
        example: "RREO-Anexo 01"
        description: "Anexo do Demonstrativo"
  Entes:
    type: "object"
    #required:
    #  - null
    properties:
      cod_ibge:
        type: "integer"
        format: "int64"
        example: 1718659
        description: "Código IBGE do Ente da Federação ao qual pertence a instituição"
      ente:
        type: "string"
        example: "Rio da Conceição"
        description: "Nome do ente da federação"
      capital:
        type: "integer"
        format: "int64"
        example: 1
        description: "Atributo que indica se um município é a capital do estado ou não. Onde 1 = Sim, 0 = Não"
        enum:
        - 0
        - 1
      regiao:
        type: "string"
        example: "CO"
        description: "Região geográfica a qual pertence o ente. Retorna BR quando se tratar de estados."
        enum:
        - "SU"
        - "NE"
        - "NO"
        - "SE"
        - "CO"
        - "BR"
      uf:
        type: "string"
        example: "TO"
        description: "Unidade da federação à qual pertence o município"
        enum:
        - "AC"
        - "AL"
        - "AM"
        - "AP"
        - "BA"
        - "CE"
        - "DF"
        - "ES"
        - "GO"
        - "MA"
        - "MG"
        - "MS"
        - "MT"
        - "PA"
        - "PB"
        - "PE"
        - "PI"
        - "PR"
        - "RJ"
        - "RN"
        - "RO"
        - "RR"
        - "RS"
        - "SC"
        - "SE"
        - "SP"
        - "TO"
      esfera:
        type: "string"
        example: 'M'
        description: "Refere-se à esfera de governo onde: U = União, E = Estados, D = DF e M=Municípios"
        enum:
        - "M"
        - "E"
        - "U"
        - "D"
      an_exercicio:
        type: integer
        format: "int64"
        example: 2019
        description: "Ano de referência dos dados populacionais"
      populacao:
        type: "integer"
        format: "int64"
        example: 1728214
        description: "Estimativa da quantidade de habitantes para o exercício de referência dos dados"
      co_cnpj:
        type: "string"
        example: "2508682800013"
        description: "Código do Cadastro Nacional de Pessoas Jurídicas - CNPJ principal do ente da federação"
  Extrato:
    type: "object"
    #required:
    #  - null
    properties:
      exercicio:
        type: "integer"
        format: "int64"
        example: 2014
        description: "Ano de referência dos dados"
      cod_ibge:
